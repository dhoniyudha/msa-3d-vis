<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D DP Step-by-Step dengan Label Sekuens di Sumbu - Isaev 2.4</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.9);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        input[type="range"] {
            width: 180px;
            cursor: pointer;
        }
        #details-panel {
            position: absolute;
            top: 80px;
            right: 15px;
            width: 380px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            font-size: 0.88rem;
            z-index: 10;
        }
        h2 {
            font-size: 1rem;
            margin-top: 0;
            color: #f59e0b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }
        .math-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            margin: 8px 0;
            border-left: 3px solid var(--accent-color);
        }
        .option-item {
            margin: 6px 0;
            padding: 6px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
        }
        .option-item.selected {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            font-weight: bold;
        }
        #hint-text {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            background: var(--panel-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="top-bar">
        <div class="title">3D DP dengan Label Huruf Sekuens Sumbu</div>
        <div class="controls-group">
            <button onclick="changeStep(-1)">◀ Sebelumnya</button>
            <input type="range" id="step-slider" min="0" max="79" value="0" oninput="setStep(this.value)">
            <button onclick="changeStep(1)">Selanjutnya ▶</button>
            <button id="btn-play" onclick="togglePlay()">▶ Play</button>
        </div>
    </div>

    <div id="details-panel">
        <h2>Detail Sel & Pembobotan</h2>
        <div id="cell-info">Proses inisialisasi...</div>
    </div>

    <div id="hint-text">💡 Putar: Klik & drag | Zoom: Scroll | Label Sumbu: Merah (X=AATC), Hijau (Y=GTC), Biru (Z=AAG)</div>

    <script>
        // Data Sekuens Asli
        const seqX = "AATC"; // Merah (i1: 0..4)
        const seqY = "GTC";  // Hijau (i2: 0..3)
        const seqZ = "AAG";  // Biru  (i3: 0..3)

        const dimX = 5, dimY = 4, dimZ = 4;
        
        function getColumnScore(a, b, c) {
            let gaps = 0;
            if (a === '-') gaps++;
            if (b === '-') gaps++;
            if (c === '-') gaps++;

            if (gaps === 2) return -4;
            if (gaps === 1) return -2;
            if (gaps === 0) {
                if (a === b && b === c) return 2;
                if (a === b || a === c || b === c) return 1;
                return -1;
            }
            return 0;
        }

        const gridData = {};
        const stepsOrder = [];

        gridData["0,0,0"] = {
            i1: 0, i2: 0, i3: 0,
            val: 0,
            options: []
        };
        stepsOrder.push("0,0,0");

        for (let i3 = 0; i3 < dimZ; i3++) {
            for (let i2 = 0; i2 < dimY; i2++) {
                for (let i1 = 0; i1 < dimX; i1++) {
                    if (i1 === 0 && i2 === 0 && i3 === 0) continue;

                    const key = `${i1},${i2},${i3}`;
                    stepsOrder.push(key);

                    let maxVal = -Infinity;
                    const options = [];

                    const transitions = [
                        { di: -1, dj: -1, dk: -1, name: "Diag 3D (X, Y, Z)" },
                        { di: -1, dj: -1, dk:  0, name: "Diag XY (Z Gap)" },
                        { di: -1, dj:  0, dk: -1, name: "Diag XZ (Y Gap)" },
                        { di:  0, dj: -1, dk: -1, name: "Diag YZ (X Gap)" },
                        { di: -1, dj:  0, dk:  0, name: "Maju X (Y, Z Gap)" },
                        { di:  0, dj: -1, dk:  0, name: "Maju Y (X, Z Gap)" },
                        { di:  0, dj:  0, dk: -1, name: "Maju Z (X, Y Gap)" }
                    ];

                    transitions.forEach(t => {
                        const pi1 = i1 + t.di;
                        const pi2 = i2 + t.dj;
                        const pi3 = i3 + t.dk;

                        if (pi1 >= 0 && pi2 >= 0 && pi3 >= 0) {
                            const prevKey = `${pi1},${pi2},${pi3}`;
                            const prevVal = gridData[prevKey].val;

                            const charX = t.di !== 0 ? seqX[i1 - 1] : '-';
                            const charY = t.dj !== 0 ? seqY[i2 - 1] : '-';
                            const charZ = t.dk !== 0 ? seqZ[i3 - 1] : '-';

                            const scoreCol = getColumnScore(charX, charY, charZ);
                            const totalVal = prevVal + scoreCol;

                            options.push({
                                name: t.name,
                                prevKey: `F(${pi1},${pi2},${pi3})`,
                                prevVal: prevVal,
                                col: `(${charX}, ${charY}, ${charZ})`,
                                scoreCol: scoreCol,
                                totalVal: totalVal
                            });

                            if (totalVal > maxVal) {
                                maxVal = totalVal;
                            }
                        }
                    });

                    gridData[key] = {
                        i1: i1, i2: i2, i3: i3,
                        val: maxVal,
                        options: options
                    };
                }
            }
        }

        // Set Up Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(13, 11, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // Grid Spacing & Coordinates
        const spacing = 1.6;
        const offsetX = -(dimX - 1) * spacing / 2;
        const offsetY = -(dimY - 1) * spacing / 2;
        const offsetZ = -(dimZ - 1) * spacing / 2;

        function getPos(i, j, k) {
            return new THREE.Vector3(i * spacing + offsetX, j * spacing + offsetY, k * spacing + offsetZ);
        }

        // Render Nodes
        const sphereGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const nodeMeshes = {};

        for (let i = 0; i < dimX; i++) {
            for (let j = 0; j < dimY; j++) {
                for (let k = 0; k < dimZ; k++) {
                    const key = `${i},${j},${k}`;
                    const mat = new THREE.MeshStandardMaterial({
                        color: 0x475569,
                        transparent: true,
                        opacity: 0.15
                    });
                    const mesh = new THREE.Mesh(sphereGeo, mat);
                    mesh.position.copy(getPos(i, j, k));
                    scene.add(mesh);
                    nodeMeshes[key] = mesh;
                }
            }
        }

        // Fungsi Pembuat Text Canvas Sprite 2D di Ruang 3D
        function createTextSprite(text, color, bgColor = 'transparent', fontSize = 48) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            if (bgColor !== 'transparent') {
                ctx.fillStyle = bgColor;
                ctx.beginPath();
                ctx.arc(64, 64, 50, 0, 2 * Math.PI);
                ctx.fill();
            }

            ctx.fillStyle = color;
            ctx.font = `Bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(1.2, 1.2, 1);
            return sprite;
        }

        // --- TAMBAHAN: MEMBUAT LABEL HURUF DI TIAP SUMBU ---

        // 1. Sumbu X (Sekuens X = AATC, Warna Merah)
        for (let i = 0; i < dimX; i++) {
            const char = i === 0 ? "-" : seqX[i - 1];
            const labelText = `${i}:${char}`;
            const sprite = createTextSprite(labelText, '#f43f5e', 'rgba(244,63,94,0.15)', 42);
            const pos = getPos(i, 0, 0);
            sprite.position.set(pos.x, pos.y - 0.9, pos.z - 0.9);
            scene.add(sprite);
        }

        // 2. Sumbu Y (Sekuens Y = GTC, Warna Hijau)
        for (let j = 0; j < dimY; j++) {
            const char = j === 0 ? "-" : seqY[j - 1];
            const labelText = `${j}:${char}`;
            const sprite = createTextSprite(labelText, '#10b981', 'rgba(16,185,129,0.15)', 42);
            const pos = getPos(0, j, 0);
            sprite.position.set(pos.x - 0.9, pos.y, pos.z - 0.9);
            scene.add(sprite);
        }

        // 3. Sumbu Z (Sekuens Z = AAG, Warna Biru)
        for (let k = 0; k < dimZ; k++) {
            const char = k === 0 ? "-" : seqZ[k - 1];
            const labelText = `${k}:${char}`;
            const sprite = createTextSprite(labelText, '#38bdf8', 'rgba(56,189,248,0.15)', 42);
            const pos = getPos(0, 0, k);
            sprite.position.set(pos.x - 0.9, pos.y - 0.9, pos.z);
            scene.add(sprite);
        }

        // Title Header Sumbu di Ujung Grid
        const titleX = createTextSprite('Sumbu X (AATC)', '#f43f5e', 'transparent', 32);
        titleX.position.set(getPos(dimX-1, 0, 0).x + 1.8, offsetY - 0.9, offsetZ - 0.9);
        scene.add(titleX);

        const titleY = createTextSprite('Sumbu Y (GTC)', '#10b981', 'transparent', 32);
        titleY.position.set(offsetX - 0.9, getPos(0, dimY-1, 0).y + 1.2, offsetZ - 0.9);
        scene.add(titleY);

        const titleZ = createTextSprite('Sumbu Z (AAG)', '#38bdf8', 'transparent', 32);
        titleZ.position.set(offsetX - 0.9, offsetY - 0.9, getPos(0, 0, dimZ-1).z + 1.8);
        scene.add(titleZ);


        // Dynamic Logic Step & Play
        let currentStepIndex = 0;
        let isPlaying = false;
        let playInterval = null;

        function updateStepView() {
            const currentKey = stepsOrder[currentStepIndex];
            document.getElementById('step-slider').value = currentStepIndex;

            stepsOrder.forEach((key, idx) => {
                const mesh = nodeMeshes[key];
                if (idx < currentStepIndex) {
                    mesh.material.color.setHex(0x38bdf8);
                    mesh.material.opacity = 0.5;
                    mesh.scale.set(1, 1, 1);
                } else if (idx === currentStepIndex) {
                    mesh.material.color.setHex(0xf59e0b);
                    mesh.material.opacity = 1.0;
                    mesh.scale.set(1.8, 1.8, 1.8);
                } else {
                    mesh.material.color.setHex(0x475569);
                    mesh.material.opacity = 0.15;
                    mesh.scale.set(1, 1, 1);
                }
            });

            const data = gridData[currentKey];
            const charX = data.i1 > 0 ? seqX[data.i1 - 1] : '-';
            const charY = data.i2 > 0 ? seqY[data.i2 - 1] : '-';
            const charZ = data.i3 > 0 ? seqZ[data.i3 - 1] : '-';

            let html = `<strong>Langkah ${currentStepIndex + 1} / ${stepsOrder.length}</strong><br>`;
            html += `<div class="math-box">Sel: <strong>F(${data.i1}, ${data.i2}, ${data.i3})</strong><br>`;
            html += `Karakter Sumbu:<br>`;
            html += `<span style="color:#f43f5e">X[${data.i1}] = '${charX}'</span>, `;
            html += `<span style="color:#10b981">Y[${data.i2}] = '${charY}'</span>, `;
            html += `<span style="color:#38bdf8">Z[${data.i3}] = '${charZ}'</span></div>`;

            if (currentKey === "0,0,0") {
                html += `<p>Inisialisasi Dasar: <strong>F(0,0,0) = 0</strong></p>`;
            } else {
                html += `<strong>Opsi Transisi (Evaluasi 7 Arah):</strong>`;
                data.options.forEach(opt => {
                    const isMax = opt.totalVal === data.val;
                    html += `<div class="option-item ${isMax ? 'selected' : ''}">`;
                    html += `<strong>${opt.name}:</strong><br>`;
                    html += `${opt.prevKey} + s${opt.col} = ${opt.prevVal} + (${opt.scoreCol}) = <strong>${opt.totalVal}</strong>`;
                    if (isMax) html += ` ✓ (MAX)`;
                    html += `</div>`;
                });
                html += `<div class="math-box" style="border-left-color: #10b981;">`;
                html += `Nilai Terpilih: <strong>F(${data.i1},${data.i2},${data.i3}) = ${data.val}</strong>`;
                html += `</div>`;
            }

            document.getElementById('cell-info').innerHTML = html;
        }

        function changeStep(delta) {
            currentStepIndex = Math.max(0, Math.min(stepsOrder.length - 1, currentStepIndex + delta));
            updateStepView();
        }

        function setStep(val) {
            currentStepIndex = parseInt(val);
            updateStepView();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('btn-play');
            if (isPlaying) {
                btn.innerText = "⏸ Pause";
                playInterval = setInterval(() => {
                    if (currentStepIndex < stepsOrder.length - 1) {
                        changeStep(1);
                    } else {
                        togglePlay();
                    }
                }, 1000);
            } else {
                btn.innerText = "▶ Play";
                clearInterval(playInterval);
            }
        }

        updateStepView();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
